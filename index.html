<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card-container" onclick="this.classList.toggle('flipped')">
         <img src="images/kirby1.png" class="corner-kirby kirby-top-left" alt="Kirby">
         <img src="images/Kirby3.png" class="corner-kirby kirby-top-right" alt="Kirby">
         <img src="images/kirb2.png" class="corner-kirby kirby-bottom-left" alt="Kirby">
         <img src="images/Kirby4.png" class="corner-kirby kirby-bottom-right" alt="Kirby">

        <!-- Front of Card -->
        <div class="card-front">
            <div class="card-top">
                <div class="heart"></div>
            </div>
            
            <div class="card-content">
                <h1>Happy Valentine's Day Reze!!!</h1>
                <div class="decorative-line"></div>
                <p class="message">
                    Please continue to be beautiful, kind, and amazing. I hope di ka mainis sakin nyahahaha.
                </p>
                <p class="click-hint">✨ Click to reveal a surprise ✨</p>
            </div>
        </div>

        <!-- Back of Card -->
        <div class="card-back">
            <div class="bouquet">
                <img src="images/Valentines.png" alt="Ur Fave Color and Red Roses">
            </div>
            <p class="back-message">For You Cha! 💐</p>
            <p class="back-text">I hope you like this simple card</p>
        </div>
    </div>
</body>
</html>
